[workspace]
resolver = "2"
members = [
    "crates/apeiron-core",
    "crates/apeiron-lexer",
    "crates/apeiron-ast",
    "crates/apeiron-parser",
    "crates/apeiron-analyzer",
    "crates/apeiron-ir",
    "crates/apeiron-runtime",
    "crates/apeiron-effects",
    "crates/apeiron-stdlib",
    "crates/apeiron-repl",
    "crates/apeiron-manifest",
    "crates/apeiron-fmt",
    "crates/apeiron-lsp",
    "crates/apeiron-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"
authors = ["Apeiron Contributors"]
description = "Apeiron — an AI-native declarative language and cognitive runtime"

[workspace.dependencies]
apeiron-core = { path = "crates/apeiron-core", version = "0.1.0" }
apeiron-lexer = { path = "crates/apeiron-lexer", version = "0.1.0" }
apeiron-ast = { path = "crates/apeiron-ast", version = "0.1.0" }
apeiron-parser = { path = "crates/apeiron-parser", version = "0.1.0" }
apeiron-analyzer = { path = "crates/apeiron-analyzer", version = "0.1.0" }
apeiron-ir = { path = "crates/apeiron-ir", version = "0.1.0" }
apeiron-runtime = { path = "crates/apeiron-runtime", version = "0.1.0" }
apeiron-effects = { path = "crates/apeiron-effects", version = "0.1.0" }
apeiron-stdlib = { path = "crates/apeiron-stdlib", version = "0.1.0" }
apeiron-repl = { path = "crates/apeiron-repl", version = "0.1.0" }
apeiron-manifest = { path = "crates/apeiron-manifest", version = "0.1.0" }
apeiron-fmt = { path = "crates/apeiron-fmt", version = "0.1.0" }
apeiron-lsp = { path = "crates/apeiron-lsp", version = "0.1.0" }
apeiron-cli = { path = "crates/apeiron-cli", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
libloading = "0.8"

[workspace.lints.rust]
warnings = "deny"
